:root {

  --good: #30a46c; --good-ink: #218358; --good-soft: #e6f6eb;
  --bad: #e5484d; --bad-ink: #ce2c31; --bad-soft: #feebec;
  --warn: #ffc53d; --warn-ink: #ab6400; --warn-soft: #fff7c2;
  --info-soft: #e6f4fe; --info-ink: #0d74ce;

  /* ---------- phone mock ---------- */

  function phone(sc) {

    h.push('<div class="phone-body">');

      h.push("</div>");

    if (skeleton) {
      h.push('<div class="skel"><div class="a"></div><div class="b"></div><div class="c"></div><div class="c"></div><div class="c"></div></div>');

      h.push("</div></div>");

    if (sc.cta) h.push('<div class="phone-cta' + (dead ? " dead" : "") + '">' + esc(sc.cta) + "</div>");

  /* ---------- phase detail ---------- */

  function phaseDetail(p, detailed) {
    if (!p) return "";
    var h = ['<div class="phase rise-fast">'];
    h.push('<div class="phase-kick"><span class="k">' + esc(p.kicker) + "</span>" +

    h.push('<p class="phase-one">' + esc(p.oneLiner) + "</p>");

      h.push('<div class="because"><span class="because-lead">Because you said</span>');

    h.push('<div class="phase-cols">');
    h.push('<div class="phase-col"><span class="label-xs">Screens you build</span><div class="build-list">');

  /* ============================================================

  function screenFor(p, id) {
    var sc = LIBRARY[id].screen;
    if (!p || !p.screenApp) return sc;
    var copy = {};
    for (var k in sc) if (Object.prototype.hasOwnProperty.call(sc, k)) copy[k] = sc[k];
    copy.app = p.screenApp;
    return copy;
  }

  function mkPhase(r, i) {
    var u = LIBRARY[r.id];
    return {
      name: u.name, oneLiner: u.oneLiner, why: r.why, signals: r.signals,
      build: u.whatYouBuild, apps: u.apps, effort: u.effort, effortNote: u.effortNote,
      caveat: u.caveat || "", kicker: PHASE_WHEN[i] || "Later"

  }

  function run(p, site) {
    clearTimers();
    var speed = S.revealMs;
    var host = (site || "").trim().replace(/^https?:\/\//i, "").replace(/\/.*$/, "");
    var steps = [["read", "Read your description"]];
    if (host) steps.push(["site", (p && p.live ? "Noted " : "Fetched ") + host]);
    steps.push(["match", "Matched 24 use cases, 8 anti patterns"], ["rank", "Ranked and drew the screens"]);
    set({
      step: "thinking", result: p, steps: steps, siteHost: host, ticks: {}, stamps: {},
      activeIdx: 0, openWhy: false, openReceipts: false, openPhase: null, copied: false,

      var k = d[0];

  function header() {

  function done() {
    var p = S.result;
    var tone = TONES[p.verdict.tone];
    var phases = p.recs.slice(0, 3);
    var idx = S.dir === "a"
      ? Math.min(S.openPhase === null ? 0 : S.openPhase, Math.max(phases.length - 1, 0))
      : Math.min(S.activeIdx, Math.max(phases.length - 1, 0));
    var body = S.dir === "a" ? doneA(p, tone, phases, idx) : doneB(p, tone, phases, idx);
    var tail = antipatternSection(p) + receiptsSection(p);
    if (phases.length) tail += handoffSection(p);
    tail += captureSection(p);
    return "<main>" + body + tail + "</main>";
  }

  /* ============================================================
     render
     ============================================================ */

  var app = document.getElementById("app");

  function render() {
    document.documentElement.setAttribute("data-dir", S.dir);
    var focus = document.activeElement;
    var focusAct = focus && focus.getAttribute ? focus.getAttribute("data-act") : null;
    var caret = focus && typeof focus.selectionStart === "number" ? focus.selectionStart : null;

    var view = S.step === "intake" ? (S.dir === "a" ? intakeA() : intakeB())
      : S.step === "thinking" ? thinking() : done();
    app.innerHTML = header() + view;

    if (focusAct === "desc" || focusAct === "web" || focusAct === "email") {
      var next = app.querySelector('[data-act="' + focusAct + '"]');
      if (next) {
        next.focus();
        if (caret !== null && typeof next.setSelectionRange === "function") {
          try { next.setSelectionRange(caret, caret); } catch (e) { /* not a text field */ }
        }
      }
    }
  }

  // Picking an industry no longer loads a persona — it is just an input to
  // the matcher, so the answer comes from what the visitor actually wrote.
  function pickIndustry(key) {
    var ind = INDUSTRIES.filter(function (i) { return i.key === key; })[0];
    if (ind) set({ industry: ind.key, persona: null });
  }

  // A worked example runs its hand written verdict, but only while it is
  // untouched. Edit the description and it becomes your own input.
  function submit() {
    var desc = S.description.trim();
    if (desc.length < 20) {
      set({ footNote: "Tell us a bit more first, at least a sentence or two." });
      return;
    }
    if (S.persona && desc === PERSONAS[S.persona].description.trim()) {
      run(PERSONAS[S.persona], S.website);
      return;
    }
    if (!S.industry) {
      set({ footNote: "Pick an industry too, so we know which use cases to weigh." });
      return;
    }
    run(assess({ industry: S.industry, description: S.description, website: S.website }), S.website);
  }

  function doCopy() {
    var md = buildPrompt(S.result).markdown;
    var finish = function () { set({ copied: true }); at(1800, function () { set({ copied: false }); }); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(finish, finish);
    } else {
      var ta = document.createElement("textarea");
      ta.value = md; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (err) { /* clipboard unavailable */ }
      document.body.removeChild(ta); finish();
    }
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act"), v = t.getAttribute("data-v");
    if (act === "dir") set({ dir: v });
    else if (act === "industry") pickIndustry(v);
    else if (act === "preset") {
      var d = PERSONAS[v];
      set({ persona: v, industry: d.industry, description: d.description, website: d.website,
        footNote: "Loaded. Hit get my answer." });
    }
    else if (act === "submit") submit();
    else if (act === "reset") { clearTimers(); set({ step: "intake", footNote: "Takes about fifteen seconds." }); }
    else if (act === "why") set({ openWhy: !S.openWhy });
    else if (act === "receipts") set({ openReceipts: !S.openReceipts });
    else if (act === "phase") set({ openPhase: S.openPhase === Number(v) ? null : Number(v) });
    else if (act === "active") set({ activeIdx: Number(v) });
    else if (act === "copy") doCopy();
    else if (act === "send") {
      if (!S.email || S.email.indexOf("@") === -1) {
        set({ emailMsg: "Add an email address and we will send it over." });
        return;
      }
      set({ emailMsg: "Sent. Check your inbox in a minute.", emailSent: true });
    }
  });

  app.addEventListener("keydown", function (e) {
    var t = e.target.closest('[data-act="active"]');
    if (t && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      set({ activeIdx: Number(t.getAttribute("data-v")) });
    }
  });

  // Typing updates state without a full re-render, so the caret is never
  // disturbed; the counter and website affordances are patched in place.
  app.addEventListener("input", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "desc") {
      S.description = t.value;
      var c = app.querySelector(".console-bar .counter");
      if (c) c.textContent = S.description.length + " / 1200";
    } else if (act === "web") {
      S.website = t.value;
      var on = S.website.trim().length > 0;
      var wrap = app.querySelector(".web-wrap") || app.querySelector(".console-web");
      if (wrap) wrap.classList.toggle("filled", on);
      var hint = app.querySelector(".web-hint");
      if (hint) {
        hint.classList.toggle("filled", on);
        hint.textContent = on
          ? "We will read this page as part of the assessment."
          : "Skip it and we work from your description alone.";
      }
    } else if (act === "email") {
      S.email = t.value;
    }
  });

  render();
})();
</script>
